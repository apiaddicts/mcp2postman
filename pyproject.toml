[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp2postman"
version = "1.0.0"
description = "Convert an MCP server (Streamable HTTP or stdio) into a Postman collection with contract, required and optional attribute tests."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE.md"]
requires-python = ">=3.10"
authors = [{ name = "APIAddicts", email = "devrel@apiaddicts.org" }]
keywords = ["mcp", "model-context-protocol", "postman", "testing", "json-rpc", "cli"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
mcp2postman = "mcp2postman.cli:main"

[project.urls]
Homepage = "https://github.com/apiaddicts/mcp2postman"
Repository = "https://github.com/apiaddicts/mcp2postman"
Issues = "https://github.com/apiaddicts/mcp2postman/issues"
Changelog = "https://github.com/apiaddicts/mcp2postman/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]

[tool.ruff.lint.isort]
known-first-party = ["mcp2postman"]
known-local-folder = ["helpers", "conftest", "demo_server"]

[tool.ruff.lint.per-file-ignores]
"src/mcp2postman/scripts.py" = ["E501"]
